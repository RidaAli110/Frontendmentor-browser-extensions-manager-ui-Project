<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Browser extensions manager UI</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        color: white;
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 73%, 66%);
      }
    </style>
  </head>
  <body>
    <!-- Top Nav bar -->
    <nav id="top-nav">
      <img
        src="./assets/images/logo-dark.svg"
        id="app-logo"
        alt="Extensions Logo"
      />
      <button type="button" id="theme-btn">
        <img src="./assets/images/icon-sun.svg" alt="Light mode icon" />
      </button>
    </nav>
    <main>
      <div class="heading-container">
        <header>
          <h1 class="heading">Extensions List</h1>
        </header>
        <!-- Filter Area -->
        <section id="filter">
          <button class="filter-btn-active filter-btn">All</button>
          <button class="filter-btn">Active</button>
          <button class="filter-btn">Inactive</button>
        </section>
      </div>
      <!-- Cards Section -->
      <section>
        <ul class="card-list"></ul>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
       Coded by <a href="#">Rida</a>.
    </footer>
  </body>
</html>
